format_version = 1
id = "super-mario-rpg.diagnostics.replay"
version = "1.0.0"
name = "Crash diagnostics and replay"
author = "mstan"
description = "Keep recent inputs and full-machine checkpoints locally for reproducing a crash. Nothing is uploaded automatically."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "super-mario-rpg-us"
rom_sha256 = "740646f3535bfb365ca44e70d46ab433467b142bd84010393070bd0b141af853"

[[feature]]
id = "replay-capture"
name = "Crash diagnostics and replay"
description = "Record the latest ten minutes of inputs and SA-1 machine checkpoints in logs/. A slow disk stops capture without stopping gameplay. Use Start diagnostics for failures before gameplay, then Collect diagnostics after closing."
group = "Diagnostics"
default_enabled = false

[[plugin]]
feature = "replay-capture"
id = "super-mario-rpg.diagnostics"
