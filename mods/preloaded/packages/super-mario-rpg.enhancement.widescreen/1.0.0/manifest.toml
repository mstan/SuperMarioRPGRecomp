format_version = 1
id = "super-mario-rpg.enhancement.widescreen"
version = "1.0.0"
name = "Super Mario RPG Widescreen"
author = "mstan"
description = "Enables Super Mario RPG's adaptive widescreen viewport and optional edge-aware HUD placement."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "super-mario-rpg-us"
rom_sha256 = "740646f3535bfb365ca44e70d46ab433467b142bd84010393070bd0b141af853"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "Follow the live window aspect at the native 224-line height, expanding the viewport when there is safe horizontal room."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "hud"
label = "HUD"
description = "Split moves supported HUD elements toward the wider viewport edges. Authentic keeps stock 4:3 placement."
group = "Display"
type = "choice"
default = "split"

[[option.choice]]
value = "split"
label = "Split to edges"

[[option.choice]]
value = "authentic"
label = "Authentic centered"

[[plugin]]
feature = "widescreen"
id = "super-mario-rpg.widescreen"
