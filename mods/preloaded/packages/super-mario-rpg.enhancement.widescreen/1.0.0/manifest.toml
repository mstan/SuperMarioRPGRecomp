format_version = 1
id = "super-mario-rpg.enhancement.widescreen"
version = "1.0.0"
name = "Super Mario RPG Custom Renderer"
author = "mstan"
description = "Experimental custom field renderer: reveal scenery and actors beyond the native camera without widening the emulated PPU."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "super-mario-rpg-us"
rom_sha256 = "740646f3535bfb365ca44e70d46ab433467b142bd84010393070bd0b141af853"

[[feature]]
id = "widescreen"
name = "Custom field renderer (experimental)"
description = "Reveal more of the current map. Menus, battles and unsupported scenes retain the native view. Some actor effects remain incomplete."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Viewport"
description = "Fit follows the window while keeping the original pixel aspect. Fixed ratios use letterboxing."
group = "Display"
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to window"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[plugin]]
feature = "widescreen"
id = "super-mario-rpg.widescreen"
