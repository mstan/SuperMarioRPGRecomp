format_version = 1
id = "super-mario-rpg.enhancement.widescreen"
version = "1.0.0"
name = "Super Mario RPG Widescreen (Experimental)"
author = "mstan"
description = "Experimental widescreen custom renderer. Disabled by default; normal play uses the original 4:3 renderer."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "super-mario-rpg-us"
rom_sha256 = "740646f3535bfb365ca44e70d46ab433467b142bd84010393070bd0b141af853"

[[feature]]
id = "widescreen"
name = "Widescreen (Experimental)"
description = "Enable the experimental custom renderer to reveal more of the map and existing battle backdrop borders. Disable for the original 4:3 renderer. Menus and title retain the native view. Some actor effects remain incomplete."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "Viewport"
description = "Fit follows the window while keeping the original pixel aspect. Fixed ratios use letterboxing."
group = "Display"
type = "choice"
default = "fit"

[[option.choice]]
value = "fit"
label = "Fit to window"

[[option.choice]]
value = "16:9"
label = "16:9"

[[option.choice]]
value = "21:9"
label = "21:9"

[[plugin]]
feature = "widescreen"
id = "super-mario-rpg.widescreen"
